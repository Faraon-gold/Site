version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: univ_db
      POSTGRES_USER: univ_user
      POSTGRES_PASSWORD: your_secure_password_here  # ← не 1234!
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"  # опционально, для локального доступа

  web:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://univ_user:your_secure_password_here@db:5432/univ_db
    depends_on:
      - db
    restart: unless-stopped

volumes:
  postgres_data: